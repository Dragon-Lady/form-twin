name: CI
on:
  push:
    branches: [main, "build/**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install through Socket Firewall
        run: npx --yes sfw@2.0.6 npm ci --ignore-scripts --no-audit --no-fund
      - name: Private and generic privacy checks
        env:
          PUSH_GUARD_BLOCKED_TERMS: ${{ secrets.PUSH_GUARD_BLOCKED_TERMS }}
          REQUIRE_PRIVATE_TERMS: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: npm run test:privacy
      - name: TypeScript check
        run: npm run typecheck
      - name: Unit tests and time zones
        run: |
          npm test
          npm run test:tz
      - name: Build and check every precached asset
        run: |
          npm run build
          npm run test:precache
      - name: Use official HTTPS Ubuntu mirrors
        run: |
          # Avoid a stalled Azure mirror retrying every browser dependency.
          sudo tee /etc/apt/apt-mirrors.txt >/dev/null <<'MIRRORS'
          https://archive.ubuntu.com/ubuntu
          https://security.ubuntu.com/ubuntu
          MIRRORS
          sudo tee /etc/apt/apt.conf.d/zzzz-ci-network >/dev/null <<'APT'
          Acquire::Retries "0";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          APT
          apt-config dump Acquire::Retries Acquire::http::Timeout Acquire::https::Timeout
      - name: Install test browsers through Socket Firewall
        timeout-minutes: 8
        run: npx --yes sfw@2.0.6 npx --no-install playwright install --with-deps chromium firefox
      - name: Browser, offline, clipboard, print and accessibility checks
        run: npm run test:e2e
